name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio voluptuous
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix tests/frontend test
      - run: python -m compileall -q custom_components
      - run: python scripts/build_release.py
